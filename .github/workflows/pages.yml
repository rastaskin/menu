# Деплой web/ на GitHub Pages при пуше в main. Сначала тесты.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - name: Модель, кодек таблицы, синхронизация
        run: npm test
      # Без --with-deps: системные библиотеки уже есть в образе, а apt-зеркало
      # тянет шрифты по ~50 КБ/с и подвешивает сборку.
      - name: Браузер для E2E
        run: npx playwright install --only-shell chromium
      - name: E2E — правки, сохранение, второе устройство, правка в таблице
        run: npm run test:e2e

  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deploy
        uses: actions/deploy-pages@v5
